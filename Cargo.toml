[package]
name = "kanban"
version = "0.1.0"
edition = "2021"
description = "A kanban board system for coding agents across multiple projects"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = "0.11"
mcp-server = { package = "rust-mcp-sdk", version = "0.9" }
console = "0.15"
