[package]
name = "kanban"
version = "0.3.0"
edition = "2021"
description = "A kanban board system for coding agents across multiple projects"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
pulldown-cmark = "0.11"
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["macros", "server", "stdio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"

# WebUI (optional)
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
mime_guess = { version = "2", optional = true }

[features]
default = []
webui = ["dep:axum", "dep:tower-http", "dep:mime_guess"]

[dev-dependencies]
serde_json = "1"
